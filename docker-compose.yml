services:
  # Redis service
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ocr-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend FastAPI service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocr-backend
    ports:
      - "8000:8000"
    environment:
      - SOKETI_SERVER_URL=http://soketi:6001
      - SOKETI_APP_ID=app-id
      - SOKETI_APP_KEY=app-key
      - SOKETI_APP_SECRET=app-secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - RQ_REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      soketi:
        condition: service_started
    networks:
      - ocr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Soketi WebSocket server (Pusher-compatible)
  soketi:
    image: quay.io/soketi/soketi:1.4-16-debian
    container_name: ocr-soketi
    ports:
      - "6001:6001"
    command: ["node", "/app/bin/server.js", "start"]
    environment:
      - SOKETI_DEBUG=1
      - SOKETI_DEFAULT_APP_ID=app-id
      - SOKETI_DEFAULT_APP_KEY=app-key
      - SOKETI_DEFAULT_APP_SECRET=app-secret
      - SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES=true
      - SOKETI_DEFAULT_APP_ENABLED=true
      - SOKETI_DEFAULT_APP_MAX_CONNECTIONS=1000
      - SOKETI_DEFAULT_APP_ENABLE_AUTHORIZATION=false
      - SOKETI_DEFAULT_APP_ENABLE_STATS=false
      - SOKETI_DEFAULT_APP_WEBHOOKS=[]
      - SOKETI_MODE=full
      - SOKETI_DB_REDIS_HOST=redis
      - SOKETI_DB_REDIS_PORT=6379
      - SOKETI_DB_REDIS_DB=0
      - SOKETI_ADAPTER_DRIVER=redis
      - SOKETI_ADAPTER_REDIS_HOST=redis
      - SOKETI_ADAPTER_REDIS_PORT=6379
      - SOKETI_ADAPTER_REDIS_DB=1
    networks:
      - ocr-network
    restart: unless-stopped
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "--tries=1", "http://localhost:6001"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Next.js service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_PUSHER_APP_KEY=app-key
        - NEXT_PUBLIC_PUSHER_HOST=localhost
        - NEXT_PUBLIC_PUSHER_PORT=6001
        - NEXT_PUBLIC_PUSHER_SCHEME=ws
    container_name: ocr-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_PUSHER_APP_KEY=app-key
      - NEXT_PUBLIC_PUSHER_HOST=localhost
      - NEXT_PUBLIC_PUSHER_PORT=6001
      - NEXT_PUBLIC_PUSHER_SCHEME=ws
      - DOCKER_ENV=true
    depends_on:
      - backend
      - soketi
    networks:
      - ocr-network
    restart: unless-stopped

  # RQ Worker service
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocr-worker
    command: ["worker"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - RQ_REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - ocr-network
    restart: unless-stopped

volumes:
  redis_data:
  # Volume for persistent data if needed
  ocr-data:

networks:
  ocr-network:
    driver: bridge
