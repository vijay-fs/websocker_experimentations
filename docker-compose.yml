services:
  # Backend FastAPI service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocr-backend
    ports:
      - "8000:8000"
    environment:
      - SOCKETIO_SERVER_URL=http://websocket-server:8001
    depends_on:
      - websocket-server
    networks:
      - ocr-network
    restart: unless-stopped

  # WebSocket server service
  websocket-server:
    build:
      context: ./websocket-server
      dockerfile: Dockerfile
    container_name: ocr-websocket
    ports:
      - "8001:8001"
    networks:
      - ocr-network
    restart: unless-stopped

  # Frontend Next.js service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ocr-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=http://localhost:8001
    depends_on:
      - backend
      - websocket-server
    networks:
      - ocr-network
    restart: unless-stopped

networks:
  ocr-network:
    driver: bridge

volumes:
  # Volume for persistent data if needed
  ocr-data:
