services:
  # Redis service
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ocr-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend FastAPI service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocr-backend
    ports:
      - "8000:8000"
    environment:
      - PUSHER_APP_ID=2054052
      - PUSHER_KEY=f69118021e989cd5a601
      - PUSHER_SECRET=88860a25217dd497edca
      - PUSHER_CLUSTER=ap2
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - RQ_REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ocr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    dns:
      - 8.8.8.8
      - 8.8.4.4

  # Frontend Next.js service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ocr-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_PUSHER_APP_KEY=f69118021e989cd5a601
      - NEXT_PUBLIC_PUSHER_CLUSTER=ap2
      - DOCKER_ENV=true
    depends_on:
      - backend
    networks:
      - ocr-network
    restart: unless-stopped

  # RQ Worker service
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocr-worker
    command: ["worker"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - RQ_REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - ocr-network
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 1g
    dns:
      - 8.8.8.8
      - 8.8.4.4

volumes:
  redis_data:
  # Volume for persistent data if needed
  ocr-data:

networks:
  ocr-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: docker-ocr
