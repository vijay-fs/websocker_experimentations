[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for websocket tutorial"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "aiohttp>=3.12.15",
    "easyocr>=1.7.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "rq>=1.15.0",
    "pusher>=3.3.2",
]
